name: Benchmark Zachitan

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'lib/forecast.mjs'
      - 'lib/model-v5.mjs'
      - 'lib/model-v6.mjs'
      - 'lib/model-qualification.mjs'
      - 'lib/model-holdout.mjs'
      - 'lib/model-history.mjs'
      - 'lib/market-integrity.mjs'
      - 'lib/market-integrity-v6.mjs'
      - 'lib/analysis-engine-v6.mjs'
      - 'lib/market-source-v6.mjs'
      - 'lib/market-data-v6.mjs'
      - 'lib/market-api-v6.mjs'
      - 'lib/providers/**'
      - 'app/api/data/route.js'
      - 'scripts/benchmark.mjs'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [master]
    paths:
      - 'lib/forecast.mjs'
      - 'lib/model-v5.mjs'
      - 'lib/model-v6.mjs'
      - 'lib/model-qualification.mjs'
      - 'lib/model-holdout.mjs'
      - 'lib/model-history.mjs'
      - 'lib/market-integrity.mjs'
      - 'lib/market-integrity-v6.mjs'
      - 'lib/analysis-engine-v6.mjs'
      - 'lib/market-source-v6.mjs'
      - 'lib/market-data-v6.mjs'
      - 'lib/market-api-v6.mjs'
      - 'lib/providers/**'
      - 'app/api/data/route.js'
      - 'scripts/benchmark.mjs'
      - '.github/workflows/benchmark.yml'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run real-market benchmark
        run: npm run benchmark
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zachitan-benchmark-report
          path: benchmark-output/report.json
          if-no-files-found: warn
          retention-days: 30
