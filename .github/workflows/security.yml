name: Security Audit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependency graph
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Reject high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
